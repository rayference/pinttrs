name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest

    # Trusted Publishing: no API token is used. The 'pypi' environment must be
    # registered as a trusted publisher for the project on PyPI.
    # https://docs.pypi.org/trusted-publishers/
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheels
        run: |
          uv build

      - name: Test build
        run: |
          python3 -m venv fresh_env
          . fresh_env/bin/activate
          pip install dist/*.whl
          fresh_env/bin/python -c "import pintext; print(pintext.__version__)"

      - name: Upload to PyPI
        run: |
          uv publish
