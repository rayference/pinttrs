name: CI
on:
  push:
    branches:
      - master
      - main

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ !github.event.pull_request.draft }}
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

  core-only:
    # The core must depend on Pint alone: install without extras or dev
    # dependencies and make sure the core imports and its tests pass. A stray
    # 'import attrs' or 'import pydantic' in the core fails here.
    if: ${{ !github.event.pull_request.draft }}
    name: Core-only install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the package without extras
        run: uv sync --no-default-groups --no-editable

      - name: Check that the core imports
        run: uv run --no-sync python -c "import pintext; print(pintext.__version__)"

      - name: Check that the integrations are unavailable
        run: |
          uv run --no-sync python - <<'EOF'
          for name, extra in [("pintext.attrs", "attrs"), ("pintext.pydantic", "pydantic")]:
              try:
                  __import__(name)
              except ImportError as e:
                  assert extra in str(e), f"unhelpful ImportError for {name}: {e}"
              else:
                  raise AssertionError(f"{name} imported without the '{extra}' extra")
          EOF

      - name: Run core tests
        run: |
          uv pip install pytest
          uv run --no-sync pytest tests/core

  tests:
    if: ${{ !github.event.pull_request.draft }}
    name: Tests

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          # - macOS-latest
          # - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and set the python version (${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Tests
        run: uv run coverage run -m pytest

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    if: ${{ !github.event.pull_request.draft }}
    name: Combine coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Use latest, so it understands all syntax.
          python-version: "3.12"

      - run: python -m pip install --upgrade coverage[toml]

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty
          python -m coverage json

          TOTAL=$(python -c "import json;print(json.load(open('reports/coverage/coverage.json'))['totals']['percent_covered_display'])")
          REPORT=$(python -m coverage report)

          echo "### Total coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${REPORT}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: reports/coverage/html
